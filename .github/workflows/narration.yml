name: Narration

# Rebuilds audio/methodology.mp3 when the methodology prose changes, and commits
# the result. The Pages workflow then deploys it like any other file.
#
# Why commit rather than build at deploy time: the narration is one ~5 MB file
# that changes only when the prose does, so rebuilding on every deploy would
# spend a minute of CI to produce identical bytes. Committing also keeps the
# audio available to anyone who clones the repo, and lets `make audio-check`
# work as a local pre-commit check.
#
# Staleness is decided by scripts/narrate.py --check, which compares a hash of
# the spoken text with the hash recorded in the sidecar. File mtimes are useless
# here: a fresh checkout gives every file the same timestamp.

on:
  push:
    branches: [main]
    paths:
      - methodology.html
      - scripts/narrate.py
      - .github/workflows/narration.yml
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the narration is already up to date
        type: boolean
        default: false

# Never let two narration commits race each other onto main.
concurrency:
  group: narration
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  narrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is the narration stale?
        id: check
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "Forced rebuild requested."
          elif python3 scripts/narrate.py --check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ffmpeg
        if: steps.check.outputs.stale == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      # The voice is a 63 MB ONNX download. Cached so a rebuild does not refetch
      # it, and kept outside the working tree so it can never be committed.
      - name: Cache the piper voice
        if: steps.check.outputs.stale == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper-voices
          key: piper-voice-en_GB-alba-medium

      - name: Install piper
        if: steps.check.outputs.stale == 'true'
        run: python3 -m pip install --quiet piper-tts

      - name: Rebuild the narration
        if: steps.check.outputs.stale == 'true'
        run: make audio

      - name: Commit the rebuilt narration
        if: steps.check.outputs.stale == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # narrate.py also rewrites methodology.html with the sentence spans.
          git add audio/methodology.mp3 audio/methodology.json methodology.html
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          # No [skip ci] here: the Pages workflow must run to publish the new
          # audio. This commit cannot retrigger *this* workflow, because the
          # paths filter above does not include audio/, and the only other file
          # it touches (methodology.html) is byte-identical once the spans are
          # in place — a rebuild that changes nothing exits before committing.
          git commit -m "Narration: rebuild the methodology audio

          Generated by scripts/narrate.py from methodology.html."
          git push
